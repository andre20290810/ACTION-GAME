<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ALEXANDRE - 2D Action Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="controls">
  <div id="pause-zone">
    <button id="pause-button" aria-label="PAUSE">PAUSE</button>
  </div>

  <div id="left-stick-col">
    <div id="aim-stick-zone">
      <div id="aim-stick-base">
        <div id="aim-stick-sector"></div>
        <div id="aim-stick-knob"></div>
      </div>
    </div>

    <div id="action-stick-zone">
      <div id="action-stick-base">
        <div id="action-stick-knob"></div>
      </div>
    </div>
  </div>

  <div id="right-side-row">
    <div id="range-zone">
      <div id="range-label">RANGE</div>
      <input type="range" id="range-slider" min="0" max="100" value="60" step="1" aria-label="RANGE">
    </div>

    <div id="right-button-col">
      <div id="flash-zone">
        <button id="flash-button" aria-label="FLASH">
          <svg id="flash-cooldown-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="flash-ring-bg" cx="50" cy="50" r="44"></circle>
            <circle id="flash-ring-progress" cx="50" cy="50" r="44"></circle>
          </svg>
          <span id="flash-label">FLASH</span>
        </button>
      </div>
      <div id="fire-zone">
        <button id="fire-button" aria-label="FIRE">FIRE</button>
      </div>
    </div>
  </div>
</div>

<div id="mode-menu">
  <div id="mode-menu-panel">
    <div id="mode-menu-title">PAUSED</div>
    <button class="mode-btn" id="mode-boss-btn">BOSS MODE</button>
    <button class="mode-btn" id="mode-training-btn">TRAINING MODE</button>
    <button class="mode-btn" id="mode-restart-btn">RESTART</button>
    <button class="mode-btn" id="mode-resume-btn">RESUME</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
