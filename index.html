<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ALEXANDRE - 2D Action Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SECTION G: full-blackout LOADING screen — shown first, on top of
     everything, until every asset genuine-load-tracked in game.js
     (initLoadingSequence()) is confirmed drawable/playable. Never a fake
     time-based bar: the percentage text is driven from a real loaded/total
     asset count. -->
<div id="loading-screen">
  <div id="loading-text">Loading... 0%</div>
</div>

<!-- SECTION H: OPENING — the official attached video as a muted/loop/
     autoplay/playsinline background, sized via object-fit only (the source
     file itself is never re-encoded/cropped). "DARK OUT" + "TAP TO START"
     sit on top; the first tap here is also the user-gesture that unlocks
     Outbreak 1.0 (SECTION T) and advances to MAIN MENU. -->
<div id="opening-screen" hidden>
  <video id="opening-video" src="assets/video/dark_out_opening.mp4" muted loop autoplay playsinline></video>
  <div id="opening-overlay">
    <div id="opening-title">DARK OUT</div>
    <div id="opening-tap-prompt">TAP TO START</div>
  </div>
</div>

<!-- SECTION I: MAIN MENU — STORY MODE/TRAINING MODE connect to the SAME
     startMode() entry points BOSS MODE/TRAINING MODE already use in the
     PAUSE menu (no duplicate gameplay wiring); SETTING opens the exact same
     #setting-panel PAUSE MENU's own SETTING does. -->
<div id="main-menu-screen" hidden>
  <div id="main-menu-panel">
    <div id="main-menu-title">DARK OUT</div>
    <button class="mode-btn" id="main-menu-story-btn">STORY MODE</button>
    <button class="mode-btn" id="main-menu-training-btn">TRAINING MODE</button>
    <button class="mode-btn" id="main-menu-setting-btn">SETTING</button>
  </div>
</div>

<!-- SECTION E/I: the ONE shared SETTING surface — opened by either PAUSE
     MENU's or MAIN MENU's own SETTING button (see openSettingPanel() in
     game.js), so the underlying data (playerMaxLife) can never diverge
     between the two entry points. Lives outside both menus so it can
     overlay either one. -->
<div id="setting-panel" hidden>
  <div id="setting-panel-inner">
    <div id="mode-menu-title">SETTING</div>
    <div id="setting-life-label">MAX LIFE</div>
    <div id="setting-life-options">
      <button class="life-option-btn" data-life="100">100</button>
      <button class="life-option-btn" data-life="200">200</button>
      <button class="life-option-btn" data-life="300">300</button>
      <button class="life-option-btn" data-life="500">500</button>
      <button class="life-option-btn" data-life="infinity">&infin;</button>
    </div>
    <button class="mode-btn" id="setting-back-btn">BACK</button>
  </div>
</div>

<!-- PLAY AREA: the game viewport only. Canvas coordinates (W/H in game.js)
     are derived from THIS element's own rendered size, never from
     window.innerWidth/innerHeight — CONTROL AREA below is a separate
     sibling in normal document flow, so its height can never shift where
     the player/GABRIEL/bullets/etc. are positioned in-game. -->
<div id="play-area">
  <canvas id="game"></canvas>
  <div id="pause-zone">
    <button id="pause-button" aria-label="PAUSE">PAUSE</button>
  </div>
</div>

<!-- CONTROL AREA: every touch control lives here, in normal document flow
     below PLAY AREA — never an absolute/fixed overlay on top of the game
     view. Three horizontal groups: MOVE+AIM side by side (left), RANGE
     (center), FLASH/STEALTH/DASH/FIRE 2x2 grid (right). -->
<div id="control-area">
  <div id="control-left">
    <div id="action-stick-zone">
      <div id="action-stick-base">
        <div id="action-stick-knob"></div>
      </div>
    </div>
    <div id="aim-stick-zone">
      <div id="aim-stick-base">
        <div id="aim-stick-sector"></div>
        <div id="aim-stick-knob"></div>
      </div>
    </div>
  </div>

  <div id="control-center">
    <div id="range-zone" aria-label="RANGE">
      <div id="range-label">RANGE</div>
      <div id="range-track">
        <div id="range-thumb"></div>
      </div>
    </div>
  </div>

  <div id="control-right">
    <div id="button-grid">
      <div id="flash-zone">
        <button id="flash-button" aria-label="FLASH">
          <svg id="flash-cooldown-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="flash-ring-bg" cx="50" cy="50" r="44"></circle>
            <circle id="flash-ring-progress" cx="50" cy="50" r="44"></circle>
          </svg>
          <span id="flash-label">FLASH</span>
        </button>
      </div>
      <div id="stealth-zone">
        <button id="stealth-button" aria-label="STEALTH">
          <svg id="stealth-cooldown-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="stealth-ring-bg" cx="50" cy="50" r="44"></circle>
            <circle id="stealth-ring-progress" cx="50" cy="50" r="44"></circle>
          </svg>
          <span id="stealth-label">STEALTH</span>
        </button>
      </div>
      <div id="dash-zone">
        <button id="dash-button" aria-label="DASH">DASH</button>
      </div>
      <div id="fire-zone">
        <button id="fire-button" aria-label="FIRE">
          <svg id="fire-cooldown-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="fire-ring-bg" cx="50" cy="50" r="44"></circle>
            <circle id="fire-ring-progress" cx="50" cy="50" r="44"></circle>
          </svg>
          <span id="fire-label">FIRE</span>
          <span id="fire-ammo-label">30 / &infin;</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="mode-menu">
  <div id="mode-menu-panel">
    <div id="mode-menu-title">PAUSED</div>
    <button class="mode-btn" id="mode-boss-btn">BOSS MODE</button>
    <button class="mode-btn" id="mode-training-btn">TRAINING MODE</button>
    <button class="mode-btn" id="mode-setting-btn">SETTING</button>
    <button class="mode-btn" id="mode-restart-btn">RESTART</button>
    <button class="mode-btn" id="mode-resume-btn">RESUME</button>
  </div>
</div>

<!-- SECTION N: landscape stages aren't ready yet — this pure-CSS overlay
     (see style.css's own (orientation: landscape) media query) blocks play
     until the device is portrait again; game.js's render loop freezes in
     sync via the same media feature. -->
<div id="landscape-block-overlay">
  <div id="landscape-block-message">縦画面でプレイしてください</div>
</div>

<script src="game.js"></script>
</body>
</html>
