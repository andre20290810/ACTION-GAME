<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DARK OUT</title>
<meta name="description" content="DARK OUT — a dark 2D action boss-fight prototype.">
<!-- SECTION B: OGP/Twitter card, using the attached thumbnail as-is (byte-identical copy at assets/branding/dark_out_thumbnail.jpg, never re-cropped/regenerated). -->
<meta property="og:title" content="DARK OUT">
<meta property="og:type" content="website">
<meta property="og:image" content="https://andre20290810.github.io/ACTION-GAME/assets/branding/dark_out_thumbnail.jpg">
<meta property="og:url" content="https://andre20290810.github.io/ACTION-GAME/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DARK OUT">
<meta name="twitter:image" content="https://andre20290810.github.io/ACTION-GAME/assets/branding/dark_out_thumbnail.jpg">
<link rel="icon" href="assets/branding/dark_out_thumbnail.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="assets/branding/dark_out_thumbnail.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SECTION G: full-blackout LOADING screen — shown first, on top of
     everything, until every asset genuine-load-tracked in game.js
     (initLoadingSequence()) is confirmed drawable/playable. Never a fake
     time-based bar: the percentage text is driven from a real loaded/total
     asset count. -->
<div id="loading-screen">
  <div id="loading-bar-track">
    <div id="loading-bar-fill"></div>
  </div>
</div>

<!-- SECTION H/D: OPENING — the official attached video as a muted/loop/
     autoplay/playsinline background, sized via object-fit only (the source
     file itself is never re-encoded/cropped). This SAME video keeps
     playing behind BOTH the "DARK OUT"/"TAP TO START" overlay AND the
     STORY/TRAINING/SETTING menu overlay that replaces it after the first
     tap — see #main-menu-overlay below — never a second video element and
     never a screen swap that would hide it. -->
<div id="opening-screen" hidden>
  <video id="opening-video" src="assets/video/dark_out_opening.mp4" muted loop autoplay playsinline></video>
  <div id="opening-overlay">
    <div id="opening-title">DARK OUT</div>
    <div id="opening-tap-prompt">TAP TO START</div>
  </div>
  <!-- SECTION D: deliberately NOT a boxed/paneled menu — plain vertical
       text directly over the video, so the OPENING footage stays the
       visual focus. STORY MODE/TRAINING MODE route through the SAME
       startMode() PAUSE MENU's own buttons already use (no duplicate
       gameplay wiring); SETTING opens the exact same #setting-panel PAUSE
       MENU's own SETTING does. -->
  <div id="main-menu-overlay" hidden>
    <button class="main-menu-item" id="main-menu-story-btn">STORY MODE</button>
    <button class="main-menu-item" id="main-menu-training-btn">TRAINING MODE</button>
    <button class="main-menu-item" id="main-menu-setting-btn">SETTING</button>
  </div>
  <!-- PART 2 SECTION A: TRAINING MODE's own BASIC/SECURITY submenu — same
       plain-text-over-video treatment as #main-menu-overlay, no boxed
       card/panel styling. Both choices route through the same startMode()
       everything else already uses. -->
  <div id="training-select-overlay" hidden>
    <button class="main-menu-item" id="training-select-basic-btn">BASIC TRAINING</button>
    <button class="main-menu-item" id="training-select-security-btn">SECURITY TRAINING</button>
    <button class="main-menu-item" id="training-select-back-btn">BACK</button>
  </div>
</div>

<!-- SECTION Q/R: RESULT — shown after GAME CLEAR (see the canvas-drawn
     "GAME CLEAR!!" overlay in game.js, which plays over the frozen final
     gameplay frame before this screen replaces it). -->
<div id="result-screen" hidden>
  <div id="result-panel">
    <div id="result-title">RESULT</div>
    <div class="result-stat"><span class="result-stat-label">PLAY TIME</span><span id="result-play-time" class="result-stat-value"></span></div>
    <div class="result-stat"><span class="result-stat-label">ACCURACY</span><span id="result-accuracy" class="result-stat-value"></span></div>
    <div class="result-stat"><span class="result-stat-label">DAMAGE TAKEN</span><span id="result-damage-taken" class="result-stat-value"></span></div>
    <div class="result-stat"><span class="result-stat-label">RANK</span><span id="result-rank" class="result-stat-value"></span></div>
    <div id="result-thanks">THANK YOU FOR PLAYING!!</div>
    <button class="mode-btn" id="result-back-btn">BACK TO TOP MENU</button>
    <!-- SECTION N: the official ARTIST PAGE URL was provided this turn —
         enabled as a real external link (never window.open()'d from JS),
         target="_blank" + rel="noopener noreferrer" per spec. -->
    <a class="mode-btn" id="result-artist-btn" href="https://www.tunecore.co.jp/artists?id=1140292&amp;utm_source=ig&amp;utm_medium=social&amp;utm_content=link_in_bio&amp;fbclid=PAdGRleAUBDaFwZG9mAmZkaWQWUNfnDNp7K4OsR1rDORVcLG0AXA4O12V4dG4DYWVtAjExAHNydGMGYXBwX2lkDzEyNDAyNDU3NDI4NzQxNAABpwXbm4sakBiMJ9ZlYKC8rJYDSVbb6nyHcFcsnqaYmSRyGKJCnX_N71DFNmgD_aem_YS0e_NpMoesX0DHRet6cWQ" target="_blank" rel="noopener noreferrer">ARTIST PAGE</a>
  </div>
</div>

<!-- SECTION M: GAME OVER — a real DOM screen (unlike GAME CLEAR's canvas
     overlay-on-frozen-frame), entered the instant PLAYER LIFE reaches 0 on
     a finite setting (see triggerGameOver() in game.js). Reaching this
     screen immediately halts update()/draw() (loop() only runs while
     screen==='gameplay'), so boss AI/projectiles/input all stop at once. -->
<div id="game-over-screen" hidden>
  <div id="game-over-panel">
    <div id="game-over-title">GAME OVER</div>
    <!-- SECTION I: left-aligned menu, same plain-text treatment as OPENING's
         own MODE SELECT (.main-menu-item, reused rather than duplicated). -->
    <button class="main-menu-item" id="game-over-retry-btn">RETRY</button>
    <button class="main-menu-item" id="game-over-quit-btn">QUIT</button>
    <a class="main-menu-item" id="game-over-artist-btn" href="https://www.tunecore.co.jp/artists?id=1140292&amp;utm_source=ig&amp;utm_medium=social&amp;utm_content=link_in_bio&amp;fbclid=PAdGRleAUBDaFwZG9mAmZkaWQWUNfnDNp7K4OsR1rDORVcLG0AXA4O12V4dG4DYWVtAjExAHNydGMGYXBwX2lkDzEyNDAyNDU3NDI4NzQxNAABpwXbm4sakBiMJ9ZlYKC8rJYDSVbb6nyHcFcsnqaYmSRyGKJCnX_N71DFNmgD_aem_YS0e_NpMoesX0DHRet6cWQ" target="_blank" rel="noopener noreferrer">ARTIST PAGE</a>
  </div>
</div>

<!-- SECTION E/I: the ONE shared SETTING surface — opened by either PAUSE
     MENU's or MAIN MENU's own SETTING button (see openSettingPanel() in
     game.js), so the underlying data (playerMaxLife) can never diverge
     between the two entry points. Lives outside both menus so it can
     overlay either one. -->
<div id="setting-panel" hidden>
  <div id="setting-panel-inner">
    <div id="mode-menu-title">SETTING</div>
    <div id="setting-life-label">MAX LIFE</div>
    <div id="setting-life-options">
      <button class="life-option-btn" data-life="100">100</button>
      <button class="life-option-btn" data-life="200">200</button>
      <button class="life-option-btn" data-life="300">300</button>
      <button class="life-option-btn" data-life="500">500</button>
      <button class="life-option-btn" data-life="infinity">&infin;</button>
    </div>
    <button class="mode-btn" id="setting-back-btn">BACK</button>
  </div>
</div>

<!-- PLAY AREA: the game viewport only. Canvas coordinates (W/H in game.js)
     are derived from THIS element's own rendered size, never from
     window.innerWidth/innerHeight — CONTROL AREA below is a separate
     sibling in normal document flow, so its height can never shift where
     the player/GABRIEL/bullets/etc. are positioned in-game. -->
<div id="play-area">
  <canvas id="game"></canvas>
  <div id="pause-zone">
    <button id="pause-button" aria-label="PAUSE">PAUSE</button>
  </div>
</div>

<!-- CONTROL AREA: every touch control lives here, in normal document flow
     below PLAY AREA — never an absolute/fixed overlay on top of the game
     view. PART 11-16: the RANGE gauge is gone entirely; MOVE/AIM/SHOT are
     now the 3 large, evenly-spaced PRIMARY controls (left/center/right),
     with STEALTH/FLASH/DASH as a smaller SECONDARY cluster occupying the
     right side across two rows — FLASH top-right, STEALTH to its left,
     DASH bottom-right (directly under FLASH), so the secondary cluster
     reads as its own compact group distinct from the 3 main controls. -->
<div id="control-area">
  <!-- Secondary row: STEALTH/FLASH only, right-aligned. -->
  <div id="control-secondary-row">
    <div id="stealth-zone">
      <button id="stealth-button" aria-label="STEALTH">
        <svg id="stealth-cooldown-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="stealth-ring-bg" cx="50" cy="50" r="44"></circle>
          <circle id="stealth-ring-progress" cx="50" cy="50" r="44"></circle>
        </svg>
        <span id="stealth-label">STEALTH</span>
      </button>
    </div>
    <div id="flash-zone">
      <button id="flash-button" aria-label="FLASH">
        <svg id="flash-cooldown-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="flash-ring-bg" cx="50" cy="50" r="44"></circle>
          <circle id="flash-ring-progress" cx="50" cy="50" r="44"></circle>
        </svg>
        <span id="flash-label">FLASH</span>
      </button>
    </div>
  </div>

  <!-- Primary row: MOVE / AIM / (SHOT + DASH), left to right. -->
  <div id="control-primary-row">
    <div id="action-stick-zone">
      <div id="action-stick-base">
        <span id="action-stick-label">MOVE</span>
        <div id="action-stick-knob"></div>
      </div>
    </div>
    <div id="aim-stick-zone">
      <div id="aim-stick-base">
        <div id="aim-stick-sector"></div>
        <span id="aim-stick-label">AIM</span>
        <div id="aim-stick-knob"></div>
      </div>
    </div>
    <div id="control-primary-right">
      <!-- SHOT: UI label only — internal fire()/FIRE_* identifiers in
           game.js are unchanged, per spec. -->
      <div id="fire-zone">
        <button id="fire-button" aria-label="SHOT">
          <svg id="fire-cooldown-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="fire-ring-bg" cx="50" cy="50" r="44"></circle>
            <circle id="fire-ring-progress" cx="50" cy="50" r="44"></circle>
          </svg>
          <span id="fire-label">SHOT</span>
          <span id="fire-ammo-label">30 / &infin;</span>
        </button>
      </div>
      <div id="dash-zone">
        <button id="dash-button" aria-label="DASH">DASH</button>
      </div>
    </div>
  </div>

  <!-- SECTION E: STUN's "CONTROL PANEL blackout" — an overlay covering
       ONLY #control-area (MOVE/AIM/SHOT/DASH/FLASH/STEALTH), toggled by
       game.js while player.stunned is true. Deliberately never removes the
       buttons underneath from the DOM (E-1) — #pause-zone/#pause-button
       live entirely outside #control-area, in #play-area, so PAUSE stays
       reachable throughout (E-3) without any special-casing here. -->
  <div id="control-blackout-overlay" hidden>
    <div id="control-blackout-message">Reboot The Control Pannel!!</div>
  </div>
</div>

<!-- SECTION S/T/U: simplified — RESUME/SETTING/QUIT (per spec's own
     minimum) plus RESTART (still a distinct, non-redundant action: restart
     THIS run from scratch). The old direct BOSS MODE/TRAINING MODE
     shortcuts are removed — QUIT -> MAIN MENU is the new way to switch
     modes, so keeping both would just be a duplicate path per U's own
     simplification instruction. -->
<div id="mode-menu">
  <div id="mode-menu-panel">
    <div id="mode-menu-title">PAUSED</div>
    <button class="mode-btn" id="mode-resume-btn">RESUME</button>
    <button class="mode-btn" id="mode-setting-btn">SETTING</button>
    <button class="mode-btn" id="mode-restart-btn">RESTART</button>
    <button class="mode-btn" id="mode-quit-btn">QUIT</button>
    <!-- SECTION G: only ever shown while player.stunned is true (toggled by
         game.js's showModeMenu() call site) — always the bottom-most item,
         below the 4 always-present ones above. -->
    <button class="mode-btn" id="mode-reboot-btn" hidden>Reboot The Control Pannel</button>
  </div>
</div>

<!-- SECTION N: landscape stages aren't ready yet — this pure-CSS overlay
     (see style.css's own (orientation: landscape) media query) blocks play
     until the device is portrait again; game.js's render loop freezes in
     sync via the same media feature. -->
<div id="landscape-block-overlay">
  <div id="landscape-block-message">縦画面でプレイしてください</div>
</div>

<script src="game.js"></script>
</body>
</html>
